services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claimcheck
      POSTGRES_PASSWORD: claimcheck
      POSTGRES_DB: claimcheck
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimcheck -d claimcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
